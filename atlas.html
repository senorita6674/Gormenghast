        // tab name alone doesn't say what curve, line, dot, or
        // hatch pattern it isolates
        btn.addEventListener("mouseenter",()=>{
            subLayerTooltipEl.innerHTML =
                '<span class="term">' + sub.name + '</span>' + sub.analysis;
            subLayerTooltipEl.style.display = "block";
        });

        btn.addEventListener("mousemove",(e)=>{
            subLayerTooltipEl.style.left = (e.clientX+16)+"px";
            subLayerTooltipEl.style.top = (e.clientY+16)+"px";
        });

        btn.addEventListener("mouseleave",()=>{
            subLayerTooltipEl.style.display = "none";
        });

        subLayerTabsEl.appendChild(btn);

    });

    subLayerTabsEl.style.display = "flex";
    updateTabHighlight();

}

function updateTabHighlight(){

    if(!focusedLayer || !focusedLayer.subLayers) return;

    Array.from(subLayerTabsEl.children).forEach((btn,i)=>{
        btn.classList.toggle("active", focusedSubLayer===focusedLayer.subLayers[i]);
    });

}

// select one sub-layer within the focused layer to isolate it,
// or pass null to show all of them overlaid again
function selectSubLayer(sub){

    focusedSubLayer = sub;

    if(focusedLayer && focusedLayer.subLayers){
        focusedLayer.subLayers.forEach(s=>{
            s.targetFade = (sub===null) ? 1 : (s===sub ? 1.5 : 0.05);
        });
    }

    if(sub){

        // the camera was framed to fit the WHOLE layer — isolating
        // one sub-layer often leaves only a small, localized cluster
        // of content inside that big frame, which reads as "nothing
        // there" even though it's technically showing correctly.
        // reframe to fit just this sub-layer's own content instead.
        const box = new THREE.Box3().setFromObject(sub.group);

        if(!box.isEmpty()){

            const center = new THREE.Vector3();
            box.getCenter(center);
            const size = new THREE.Vector3();
            box.getSize(size);

            const span = Math.max(size.x, size.z, 120); // floor so tiny glyphs don't zoom in absurdly close
            const fitHeight = Math.max(span*1.3, 300);

            camLookTarget.copy(center);
            camPosTarget.set(center.x, sub.group.parent.position.y + fitHeight, center.z + 1);
            camTransitioning = true;

        }

        uiLayerQuestion.textContent = sub.question + "  ·  click the tab again to see them all";
        uiLayerAnalysis.textContent = sub.analysis;

    }else if(focusedLayer){

        // back to the full layer's own framing
        const box = new THREE.Box3().setFromObject(focusedLayer.hit);
        const center = new THREE.Vector3();
        box.getCenter(center);
        const size = new THREE.Vector3();
        box.getSize(size);
        const span = Math.max(size.x, size.z);
        const fitHeight = Math.max(span*0.95, 400);

        camLookTarget.copy(center);
        camPosTarget.set(center.x, focusedLayer.group.position.y + fitHeight, center.z + 1);
        camTransitioning = true;

        uiLayerQuestion.textContent = focusedLayer.question + "  ·  double-click or press Esc to return";
        uiLayerAnalysis.textContent = focusedLayer.analysis;

    }

    updateTabHighlight();

}

function focusLayer(layer){

    focusedLayer = layer;
    focusedSubLayer = null;

    const box = new THREE.Box3().setFromObject(layer.hit);
    const center = new THREE.Vector3();
    box.getCenter(center);

    const size = new THREE.Vector3();
    box.getSize(size);

    // fit the camera height to how wide this layer actually is —
    // a flat height worked for the small layers but for a wide one
    // like Mind Palace (4400 units across) it left the camera
    // hovering just above empty ground between room clusters,
    // too close to see anything
    const span = Math.max(size.x, size.z);
    const fitHeight = Math.max(span * 0.95, 400);

    camLookTarget.copy(center);
    camPosTarget.set(center.x, layer.group.position.y + fitHeight, center.z + 1);
    camTransitioning = true;

    LAYERS.forEach(l=>{
        l.targetFade = (l===layer) ? 1.5 : 0.05;
    });

    if(layer.subLayers){
        layer.subLayers.forEach(s=>{ s.targetFade = 1; });
    }

    buildTabs(layer);

    if(layer.invertable){
        invertToggleEl.style.display = "block";
    }else{
        invertToggleEl.style.display = "none";
        if(shadowInverted) setShadowInverted(false);
    }

    uiLayerName.textContent = layer.name;
    uiLayerQuestion.textContent = layer.question + "  ·  double-click or press Esc to return";
    uiLayerAnalysis.textContent = layer.analysis;
    uiLayerAnalysis.classList.add("visible");

}

function returnToAtlas(){

    focusedLayer = null;
    focusedSubLayer = null;

    camPosTarget.copy(ATLAS_CAM_POS);
    camLookTarget.copy(ATLAS_CAM_TARGET);
    camTransitioning = true;

    LAYERS.forEach(l=>{ l.targetFade = 1; });

    subLayerTabsEl.innerHTML = "";
    subLayerTabsEl.style.display = "none";

    invertToggleEl.style.display = "none";
    if(shadowInverted) setShadowInverted(false);

    uiLayerName.textContent = "ATLAS — SEVEN LAYERS";
    uiLayerQuestion.textContent = "click a layer to enter it";
    uiLayerAnalysis.classList.remove("visible");

}

// distinguish an intentional click from an orbit/pan/zoom release —
// OrbitControls fires a native "click" on mouseup same as a plain
// click does, so without this, ending a drag anywhere near a
// layer's hit-plane (which covers nearly the whole footprint) would
// snap the camera into that layer and discard whatever view you'd
// just navigated to. Only treat it as "enter a layer" if the mouse
// barely moved between press and release.
let mouseDownPos = null;

window.addEventListener("mousedown",(event)=>{
    mouseDownPos = { x:event.clientX, y:event.clientY };
});

window.addEventListener("click",(event)=>{

    if(flying) return; // piloting — clicks are for looking around, not entering layers
    if(mindPalaceMode) return; // no exploded-stack layer to click into while collapsed

    // once already inside a layer, a click never re-hit-tests the
    // stack. The layer hit-planes are stacked directly above one
    // another (same x/z footprint, every 1000 units up), and a
    // single screen click can ray through several of them at once —
    // that was landing on whichever plane happened to be nearest
    // the camera, not the layer actually being viewed, and bounced
    // you sideways into a different layer mid-inspection. Esc or
    // double-click steps back out first; only then can a click
    // enter a different layer.
    if(focusedLayer) return;

    if(mouseDownPos){
        const dx = event.clientX-mouseDownPos.x, dy = event.clientY-mouseDownPos.y;
        if(Math.hypot(dx,dy) > 6) return; // that was a drag, not a click
    }

    // single click only ever ENTERS a layer — it never exits one.
    // orbiting/dragging inside a focused layer used to misfire the
    // old "click to exit" logic; double-click below handles exiting
    // instead, so free camera movement never accidentally kicks you out
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse,camera);

    const hits = raycaster.intersectObjects(layerHitPlanes);

    if(hits.length){

        const layer = LAYERS.find(l=>l.hit===hits[0].object);

        if(layer && layer!==focusedLayer){
            focusLayer(layer);
        }

    }

});

// double-click, anywhere — always steps back one level: out of a
// sub-layer first if one is selected, otherwise out to the full
// atlas overview. no hit-testing needed, so it works reliably from
// any camera angle instead of requiring a precise click on empty space
window.addEventListener("dblclick",(event)=>{

    if(flying) return; // double-click while piloting shouldn't land you back at the atlas
    if(mindPalaceMode) return; // step back out via the MIND PALACE VIEW button / Esc instead

    if(mouseDownPos){
        const dx = event.clientX-mouseDownPos.x, dy = event.clientY-mouseDownPos.y;
        if(Math.hypot(dx,dy) > 6) return; // that was a drag, not a double-click
    }

    if(focusedSubLayer){
        selectSubLayer(null);
    }else if(focusedLayer){
        returnToAtlas();
    }

});

window.addEventListener("keydown",(event)=>{

    if(event.key==="f" || event.key==="F"){
        setFlying(!flying);
        return;
    }

    if(event.key!=="Escape") return;

    if(flying) setFlying(false);
    else if(mindPalaceMode) setMindPalaceMode(false);
    else if(focusedSubLayer) selectSubLayer(null);
    else if(focusedLayer) returnToAtlas();

});

//////////////////////////////////////////////////
// UPDATE LABELS
//////////////////////////////////////////////////

animate = function(){

    requestAnimationFrame(animate);

    // smoothly move the camera toward whichever target is active
    // (atlas overview, or the focused layer's top-down view) —
    // only while actually transitioning, otherwise this would fight
    // the user's own zoom/pan/rotate every frame forever. Also
    // skipped entirely while flying — the pilot has full control.
    if(camTransitioning && !flying){

        camera.position.lerp(camPosTarget,0.06);
        controls.target.lerp(camLookTarget,0.06);

        if(camera.position.distanceTo(camPosTarget) < 1 &&
           controls.target.distanceTo(camLookTarget) < 1){
            camTransitioning = false;
        }

    }

    // ease every layer's opacity toward its target (1 = active, 0.05 = faded)
    LAYERS.forEach(l=>{

        if(Math.abs(l.currentFade - l.targetFade) > 0.001){
            l.currentFade += (l.targetFade - l.currentFade) * 0.08;
            setLayerFade(l,l.currentFade);
        }

    });

    // same easing, one level deeper, for every sub-layer across
    // Territory, Social Paracosm, and Character Paracosm — each
    // is now its own top-level slab, but still has internal tabs
    ALL_SUBLAYERS.forEach(s=>{

        if(Math.abs(s.currentFade - s.targetFade) > 0.001){
            s.currentFade += (s.targetFade - s.currentFade) * 0.08;
            setGroupFade(s.group, s.currentFade);
        }

    });

    // Mind Palace rooms drift slowly — the castle's true shape is
    // never fixed, so nothing here holds perfectly still
    const t = performance.now() * 0.001;

    roomMeshes.forEach(room=>{

        const base = room.userData.floatBase;
        const offset = Math.sin(t*room.userData.floatSpeed + room.userData.floatPhase) * 6;

        room.position.y = base.y + offset;

        if(room.userData.hitbox){
            room.userData.hitbox.position.y = base.y + room.userData.hitbox.geometry.parameters.height/2 + offset;
        }

    });

    if(flying){
        flyControls.update(flyClock.getDelta());
    }else{
        controls.update();
    }

    updateLabels();
    updateAtlasLabels();

    composer.render();

};

animate();

window.addEventListener(
'resize',
()=>{

    camera.aspect=
    window.innerWidth/
    window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    composer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}
);

</script>
