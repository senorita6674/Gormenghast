<script type="module">

import * as THREE from 'three';

import { OrbitControls }
from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

import { FlyControls }
from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/FlyControls.js';

import { EffectComposer }
from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass }
from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js';
import { ShaderPass }
from 'https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/ShaderPass.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

//////////////////////////////////////////////////
// ATLAS STACK
//////////////////////////////////////////////////

const layer1 = new THREE.Group();

scene.add(layer1);

const camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
55000
);

// ATLAS MODE — default view showing the full exploded stack
const ATLAS_CAM_POS = new THREE.Vector3(5200, 4200, 7200);
const ATLAS_CAM_TARGET = new THREE.Vector3(1600, 3000, 0);

camera.position.copy(ATLAS_CAM_POS);
camera.lookAt(ATLAS_CAM_TARGET);

const renderer = new THREE.WebGLRenderer({
    
    
    antialias:true
});

renderer.setPixelRatio(window.devicePixelRatio);

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderer.domElement
);

//////////////////////////////////////////////////
// POST-PROCESSING — stark black/white contrast
// crush, closer to the forensic-architecture /
// architectural-collage reference look, instead
// of soft faded opacity everywhere
//////////////////////////////////////////////////

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));

const contrastPass = new ShaderPass({

    uniforms:{
        tDiffuse:{ value:null },
        uCrushLow:{ value:0.10 },
        uCrushHigh:{ value:0.50 },
        uKeepGlow:{ value:0.16 } // fraction of the original soft render kept, so points/fog still glow a little instead of going pure flat
    },

    vertexShader:`
        varying vec2 vUv;
        void main(){
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
        }
    `,

    fragmentShader:`
        uniform sampler2D tDiffuse;
        uniform float uCrushLow;
        uniform float uCrushHigh;
        uniform float uKeepGlow;
        varying vec2 vUv;

        void main(){

            vec4 texel = texture2D(tDiffuse, vUv);

            float lum = dot(texel.rgb, vec3(0.299,0.587,0.114));

            float crushed = smoothstep(uCrushLow, uCrushHigh, lum);

            vec3 col = mix(vec3(crushed), texel.rgb, uKeepGlow);

            // subtle vignette — edges read darker, like the reference collage
            vec2 c = vUv - 0.5;
            float vig = 1.0 - dot(c,c) * 0.85;
            col *= vig;

            gl_FragColor = vec4(col, 1.0);

        }
    `

});

contrastPass.renderToScreen = true;
composer.addPass(contrastPass);

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

const roomHitboxes = [];

//////////////////////////////////////////////////
// ORBIT CONTROLS
//////////////////////////////////////////////////

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.035;   // lower = longer, softer glide once you let go
controls.enablePan = true;
controls.screenSpacePanning = true;

controls.rotateSpeed = 0.35;   // slower rotation so the mouse doesn't feel twitchy
controls.zoomSpeed = 0.55;
controls.panSpeed = 0.45;

// free zoom, both directions — no hard cap. The earlier max-out
// cap (tied to the atlas overview distance) was meant to stop
// scrolling into empty space, but in practice it reads as the
// camera getting blocked and yanked back right when zooming in
// for presentation detail. Freedom to zoom matters more here.
controls.minDistance = 1;
controls.maxDistance = 50000;

controls.target.copy(ATLAS_CAM_TARGET);

controls.update();

// the moment the user actually grabs the camera — drag, pan, or
// scroll-zoom — any automatic fly-to in progress (entering a layer,
// entering Mind Palace mode, returning to the atlas) must give up
// immediately. Without this, touching the camera before a big jump
// finishes settling means the per-frame auto-lerp keeps pulling 6%
// of the way back toward its target every frame, fighting whatever
// the user is trying to do — which reads as the view snapping back
// on its own. Mind Palace's overview jump is the largest distance
// in the app, so it's the easiest transition to get caught fighting.
controls.addEventListener("start",()=>{
    camTransitioning = false;
});

//////////////////////////////////////////////////
// FLY MODE — free drone-style navigation. OrbitControls
// only ever orbits around a fixed point; this lets you
// actually pilot the camera through the space, dive into
// a room cluster, thread between structures, no pivot.
// Off by default; toggled via the FLY MODE button or
// pressing F, and disables the orbit/click-to-focus system
// while active so the two don't fight each other.
//////////////////////////////////////////////////

const flyControls = new FlyControls(camera, renderer.domElement);
flyControls.movementSpeed = 1000;
flyControls.rollSpeed = 10;
flyControls.dragToLook = true;   // only steer while the mouse is held down, so a plain click still works elsewhere
flyControls.autoForward = false;
flyControls.enabled = false;

const flyClock = new THREE.Clock();
let flying = false;

//////////////////////////////////////////////////
// ROOM GENERATOR
//////////////////////////////////////////////////

function createRoom(
name,
x,y,z,
w,d,h
){

const pts=[];
const step=3;

for(let xx=-w/2;xx<=w/2;xx+=step){

for(let yy=0;yy<=h;yy+=step){

pts.push(
xx+(Math.random()-0.5)*2,
yy+(Math.random()-0.5)*2,
-d/2+(Math.random()-0.5)*2
);

pts.push(
xx+(Math.random()-0.5)*2,
yy+(Math.random()-0.5)*2,
d/2+(Math.random()-0.5)*2
);


}

}

for(let zz=-d/2;zz<=d/2;zz+=step){

for(let yy=0;yy<=h;yy+=step){

pts.push(
-w/2+(Math.random()-0.5)*2,
yy+(Math.random()-0.5)*2,
zz+(Math.random()-0.5)*2
);

pts.push(
w/2+(Math.random()-0.5)*2,
yy+(Math.random()-0.5)*2,
zz+(Math.random()-0.5)*2
);

}

}

for(let xx=-w/2;xx<=w/2;xx+=step){

for(let zz=-d/2;zz<=d/2;zz+=step){

pts.push(
xx+(Math.random()-0.5)*2,
0+(Math.random()-0.5)*2,
zz+(Math.random()-0.5)*2
);

pts.push(
xx+(Math.random()-0.5)*2,
h+(Math.random()-0.5)*2,
zz+(Math.random()-0.5)*2
);

}

}

const geo=new THREE.BufferGeometry();

geo.setAttribute(
'position',
new THREE.Float32BufferAttribute(
pts,
3
)
);

const cloud = new THREE.Points(
    geo,
    new THREE.PointsMaterial({
        size: 1.3,
        color: 0xffffff,
        transparent: true,
        opacity: 0.6,
        depthWrite: false,
        depthTest: true,

        sizeAttenuation: true
    })
);

cloud.position.set(
x,
y,
z
);

layer1.add(cloud);

const hitbox = new THREE.Mesh(

    new THREE.BoxGeometry(w,h,d),

    new THREE.MeshBasicMaterial({
        transparent:true,
        opacity:0
    })

);

hitbox.position.set(
    x,
    y + h/2,
    z
);

hitbox.userData.roomName = name;

layer1.add(hitbox);

roomHitboxes.push(hitbox);

cloud.userData = { roomName: name };
cloud.userData.hitbox = hitbox;

return cloud;

}

//////////////////////////////////////////////////
// GORMENGHAST ROOM GRAPH
//////////////////////////////////////////////////

const rooms = [

// use: how often this space is actually occupied/central to castle
// life, 1 (barely visited) to 10 (constant, ritual, obsessive use) —
// this is the value that drives how much a room distorts later:
// ritual rooms swell and fracture, function rooms stay small and plain

{
name:"Great Kitchen",
x:0,y:0,z:0,
w:600,d:500,h:250,
use:9
},

{
name:"Holding Room",
x:300,y:80,z:100,
w:120,d:120,h:90,
use:2
},

{
name:"Castle Roofscape",
x:650,y:400,z:0,
w:450,d:450,h:40,
use:3
},

{
name:"Fuchsia Attic",
x:900,y:700,z:-150,
w:140,d:140,h:120,
use:5
},

{
name:"Cora Clarice",
x:1200,y:650,z:150,
w:180,d:180,h:100,
use:2
},

{
name:"Prunesquallor Study",
x:1500,y:350,z:0,
w:220,d:220,h:150,
use:4
},

{
name:"Library",
x:1900,y:280,z:-250,
w:500,d:350,h:280,
use:9
},

{
name:"Schoolroom",
x:2300,y:400,z:0,
w:260,d:260,h:180,
use:4
},

{
name:"Dead Twins Room",
x:2700,y:320,z:300,
w:160,d:160,h:90,
use:1
},

{
name:"Upper Towers",
x:3100,y:1000,z:0,
w:220,d:220,h:550,
use:5
},

{
name:"Countess Chamber",
x:3500,y:1250,z:0,
w:260,d:260,h:180,
use:4
},

//////////////////////////////////////////////////
// RITUAL DISTRICT
//////////////////////////////////////////////////

{
name:"Christening Room",
x:1800,y:120,z:-900,
w:200,d:200,h:100,
use:7
},

{
name:"Ancestral Dining Hall",
x:2200,y:120,z:-900,
w:420,d:260,h:180,
use:8
},

{
name:"Hall Bright Carvings",
x:2600,y:200,z:-850,
w:350,d:200,h:180,
use:7
},

{
name:"Master Ritual",
x:2100,y:700,z:-1200,
w:140,d:140,h:140,
use:10
},

//////////////////////////////////////////////////
// EARLING LAKE
//////////////////////////////////////////////////

{
name:"Lake",
x:2600,y:-200,z:1400,
w:800,d:800,h:20,
use:3
}

];

//////////////////////////////////////////////////
// ROOM LOOKUP — the single source of truth for
// where things actually are. Other layers (territory
// fields, steerpike path, etc.) should read positions
// from here instead of inventing their own coordinates,
// so everything stacks in alignment.
//////////////////////////////////////////////////

const roomByName = {};
rooms.forEach(r=>{ roomByName[r.name] = r; });

// TRUE-3D HELPERS — every layer's flat sheet keeps its own hand-built
// near-ground y values (that's the exploded axonometric look, and it
// stays untouched). These three helpers exist only so Mind Palace
// mode can lift specific, room-tied pieces of that same content up
// to where they actually belong in real 3D: connectors run between
// two rooms' real midpoints, per-room glyphs sit on that room's real
// roof, and a group can be lifted as a whole without touching its
// own internal coordinates.
function roomMid(name){ const r = roomByName[name]; return r.y + r.h/2; }
function roomRoof(name){ const r = roomByName[name]; return r.y + r.h; }
function elevate(obj,y){
    const g = new THREE.Group();
    g.position.y = y;
    g.add(obj);
    return g;
}

// visual-only drift for Mind Palace — the castle's true shape is
// never fully known, so rooms float away from their "official"
// position instead of sitting in a confident architectural plan.
// r.x/r.y/r.z themselves are untouched — every other layer (and
// the corridor network below, which is the "official route") keeps
// reading the real canonical coordinates; only the room volume's
// own rendered position is offset.
rooms.forEach(r=>{
    r._scatterX = (Math.random()-0.5)*180;
    r._scatterY = (Math.random()-0.5)*110;
    r._scatterZ = (Math.random()-0.5)*180;
});

// the castle's actual footprint (matches Mind Palace's bounding box) —
// every other layer uses this same rectangle for its ground plane and
// click hitbox so the whole stack aligns instead of six unrelated sizes
const FOOTPRINT = { cx:1750, cz:100, w:4400, d:3200 };

// Steerpike's real route through the castle, in Mind Palace's actual
// coordinates — Territory Atlas, Steerpike Engine, and Character Atlas
// all read from this same path instead of each inventing their own
const steerpikeRoomOrder = [
    "Great Kitchen",
    "Holding Room",
    "Fuchsia Attic",
    "Prunesquallor Study",
    "Library",
    "Castle Roofscape",
    "Upper Towers"
];

const steerpikeWaypoints = steerpikeRoomOrder.map(name=>roomByName[name]);

// position at parameter t (0..1) along the real steerpike route,
// walking the waypoints as straight segments
function steerpikePointAt(t){

    const n = steerpikeWaypoints.length - 1;
    const scaled = Math.max(0,Math.min(1,t)) * n;
    const i = Math.min(n-1, Math.floor(scaled));
    const localT = scaled - i;

    const a = steerpikeWaypoints[i];
    const b = steerpikeWaypoints[i+1];

    return {
        x: a.x + (b.x-a.x)*localT,
        z: a.z + (b.z-a.z)*localT
    };

}

//////////////////////////////////////////////////
// DRAW ROOMS
//////////////////////////////////////////////////

const roomMeshes = [];

rooms.forEach(r=>{

const room = createRoom(
    r.name,
    r.x + r._scatterX,
    r.y + r._scatterY,
    r.z + r._scatterZ,
    r.w,
    r.d,
    r.h
);

room.userData.name = r.name;

// gentle continuous float — phase randomized per room so they
// don't all drift in sync, amplitude small enough to read as
// uncertainty rather than motion
room.userData.floatPhase = Math.random()*Math.PI*2;
room.userData.floatSpeed = 0.15 + Math.random()*0.15;
room.userData.floatBase = new THREE.Vector3(
    r.x + r._scatterX,
    r.y + r._scatterY,
    r.z + r._scatterZ
);

roomMeshes.push(room);

});

//////////////////////////////////////////////////
// MEMORY NOISE ROOMS
//////////////////////////////////////////////////

function createGhostRoom(x,y,z,parentRoom){

    const pts=[];      
    const step=8;      

    const scale =
        0.4 + Math.random()*1.2;

    const w =
    parentRoom.w *
    (0.5 + Math.random()*2.5);

    const d =
    parentRoom.d *
    (0.5 + Math.random()*2.5);

    const h =
    parentRoom.h *
    (0.4 + Math.random()*3.0);

    // floor

    for(let xx=-w/2;xx<=w/2;xx+=step){

        for(let zz=-d/2;zz<=d/2;zz+=step){

            if(Math.random()<0.15){

                pts.push(xx,0,zz);

            }

        }

    }

    // walls

    for(let yy=0;yy<=h;yy+=step){

        for(let xx=-w/2;xx<=w/2;xx+=step){

           if(Math.random()>0.3)
                pts.push(xx,yy,-d/2);

            if(Math.random()>0.3)
                pts.push(xx,yy,d/2);

        }

        for(let zz=-d/2;zz<=d/2;zz+=step){

            if(Math.random()>0.3)
                pts.push(-w/2,yy,zz);

            if(Math.random()>0.3)
                pts.push(w/2,yy,zz);

        }

    }

    // random missing wall sections

    pts.splice(
        Math.floor(Math.random()*pts.length*0.4),
        Math.floor(pts.length*0.25)
    );

    const geo =
    new THREE.BufferGeometry();

    geo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            pts,
            3
        )
    );

    const cloud =
    new THREE.Points(

        geo,

        new THREE.PointsMaterial({

            size:1,

            color:0xffffff,

            transparent:true,

            opacity:0.06,

            depthWrite:false

        })

    );

   // const ghostOpacity =
   // 0.02 + Math.random()*0.08;
      //  new THREE.PointsMaterial({

   // size:1,

   // color:0xffffff,

   // transparent:true,

    //opacity:ghostOpacity,

   // depthWrite:false

//});

const corners = [

[-w/2,0,-d/2],
[w/2,0,-d/2],
[-w/2,0,d/2],
[w/2,0,d/2],

[-w/2,h,-d/2],
[w/2,h,-d/2],
[-w/2,h,d/2],
[w/2,h,d/2]

];

corners.forEach(c=>{

    for(let i=0;i<150;i++){

        pts.push(
            c[0] + (Math.random()-0.5)*6,
            c[1] + (Math.random()-0.5)*6,
            c[2] + (Math.random()-0.5)*6
        );

    }

});

    cloud.position.set(x,y,z);

    cloud.rotation.y =
        Math.random()*Math.PI*2;

    layer1.add(cloud);

}

rooms.forEach(core=>{

    const clusterCount = 40;

    for(let i=0;i<clusterCount;i++){

        const angle =
            Math.random()*Math.PI*2;

        const radius =
           400 + Math.pow(Math.random(),0.5)*2500;

        createGhostRoom(
    core.x + Math.cos(angle)*radius,
    core.y + (Math.random()-0.5)*150,

function connect(a,b){

    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const dz = b.z - a.z;

    const length = Math.sqrt(
        dx*dx +
        dy*dy +
        dz*dz
    );

    const corridorGeo =
        new THREE.BoxGeometry(
            25,      // width
            25,      // height
            length
        );

    const edges =
        new THREE.EdgesGeometry(
            corridorGeo
        );

    const corridor =
        new THREE.LineSegments(
            edges,
            new THREE.LineBasicMaterial({
                color:0xffffff,
                transparent:true,
                opacity:0.12
            })
        );

    corridor.position.set(
        (a.x+b.x)/2,
        (a.y+b.y)/2,
        (a.z+b.z)/2
    );

    corridor.lookAt(
        b.x,
        b.y,
        b.z
    );

    corridor.rotateX(
        Math.PI/2
    );

    layer1.add(corridor);

}

function createCorridor(a,b){

    const pts=[];

    const width = 18;

    for(let i=0;i<700;i++){

        const t=Math.random();

        pts.push(

            THREE.MathUtils.lerp(a.x,b.x,t)
            +(Math.random()-0.5)*width,

            THREE.MathUtils.lerp(a.y,b.y,t)
            +(Math.random()-0.5)*width,

            THREE.MathUtils.lerp(a.z,b.z,t)
            +(Math.random()-0.5)*width

        );

    }

    const geo=
        new THREE.BufferGeometry();

    geo.setAttribute(
        'position',
        new THREE.Float32BufferAttribute(
            pts,
            3
        )
    );

    const cloud=
        new THREE.Points(

            geo,

            new THREE.PointsMaterial({

                size:1.2,
                color:0xffffff,
                transparent:true,
                opacity:0.18

            })

        );

    layer1.add(cloud);

return cloud;

}

function addSightline(hub,target){

    const dir = new THREE.Vector3(target.x-hub.x, target.y-hub.y, target.z-hub.z);
    dir.normalize();

    const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(hub.x,hub.y,hub.z),
        new THREE.Vector3(target.x,target.y,target.z)
    ]);

    layer1.add(new THREE.Line(geo, new THREE.LineBasicMaterial({
        color:0xffffff, transparent:true, opacity:0.45
    })));

    // small arrowhead near the target, like the star chart's rays
    const arrowLen = 40;
    const back = new THREE.Vector3(target.x,target.y,target.z).addScaledVector(dir,-arrowLen);

    let perp = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0));
    if(perp.lengthSq() < 0.0001) perp.set(1,0,0);
    perp.normalize().multiplyScalar(14);

    const wingA = back.clone().add(perp);
    const wingB = back.clone().sub(perp);

    const arrowGeo = new THREE.BufferGeometry().setFromPoints([
        wingA, new THREE.Vector3(target.x,target.y,target.z), wingB
    ]);

    layer1.add(new THREE.Line(arrowGeo, new THREE.LineBasicMaterial({
        color:0xffffff, transparent:true, opacity:0.6
    })));

}

// RITUAL DISTORTION
// rituals override function: a room's fracture/burst
// amount is driven directly by its own use value —
// rooms of constant ritual/obsessive use (Master Ritual,
// Great Kitchen, Library, Ancestral Dining Hall, the
// ritual district) swell and fracture outward from their
// own real footprint. purely functional, occasionally-
// used rooms (Holding Room, Dead Twins Room, Schoolroom,
// the Lake) get none of this and stay plain wireframe.

function shardMaterial(){
    return new THREE.MeshBasicMaterial({
        color:0x000000,
        side:THREE.DoubleSide,
        transparent:true,
        opacity:1
    });
}

function addShard(cx,cy,cz,size,angle,tilt){

    // an irregular elongated triangle, not a clean primitive —
    // random-ish offsets keep every shard a slightly different shape
    const a = new THREE.Vector3(0,0,0);
    const b = new THREE.Vector3(size*(0.7+Math.random()*0.6), size*(0.15+Math.random()*0.3), 0);
    const c = new THREE.Vector3(size*(0.15+Math.random()*0.35), -size*(0.9+Math.random()*0.8), 0);

    const geo = new THREE.BufferGeometry().setFromPoints([a,b,c]);
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo, shardMaterial());
    mesh.position.set(cx,cy,cz);
    mesh.rotation.z = angle;
    mesh.rotation.y = tilt;

    layer1.add(mesh);

    const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.35 })
    );
    edges.position.copy(mesh.position);
    edges.rotation.copy(mesh.rotation);

    layer1.add(edges);

}

// only rooms used this heavily distort at all — this is the line
// between "ritual" and "function" for this layer
const RITUAL_THRESHOLD = 6;

rooms.forEach(r=>{

    if(r.use < RITUAL_THRESHOLD) return;

    // how far past the threshold this room's use goes —
    // this single number drives shard count, size, and spread
    const weight = r.use - RITUAL_THRESHOLD;

    const shardCount = 3 + weight*2;
    const shardSize = 120 + weight*45;
    const spread = Math.max(r.w,r.d) * 0.6;

    for(let i=0;i<shardCount;i++){

        addShard(
            r.x + r._scatterX + (Math.random()-0.5)*spread,
            r.y + r._scatterY + Math.random()*r.h*1.4,
            r.z + r._scatterZ + (Math.random()-0.5)*spread,
            shardSize * (0.7+Math.random()*0.6),
            Math.random()*Math.PI*2,
            (Math.random()-0.5)*0.6
        );

    }

});

// TERRITORY, THROUGH STEERPIKE'S OWN VOCABULARY
// Not four behavioral fields — Steerpike doesn't read the
// castle as continuous territory, he reads it as discrete
// pieces stuck, tied, and folded together. This layer is
// built entirely from his own spatial vocabulary, applied
// to the castle's actual weak points: the rooms nobody
// watches closely (the same low-use rooms that stayed
// plain and undistorted in Mind Palace — what's boring to
// the castle's official self-understanding is exactly
// what's exploitable to him).
//////////////////////////////////////////////////

// WEAK POINTS — same threshold logic as Mind Palace's ritual
// distortion, read in reverse: rooms that never distorted there
// (use <= 4, low ritual/authority attention) are Steerpike's
// opportunities here
const weakPoints = rooms.filter(r => r.use <= 4);

// FOLD / CREASE / POCKET / WRAP / VEIL / PEEL / COMPRESSION —
// one glyph per weak point: stacked irregular layers, not a flat
// shape. Layer count and size scale with how little attention the
// room gets — fewer eyes, more concealment depth. The innermost
// layer is lifted and offset from the rest: Peel, access to what's
// underneath. A crease line runs through alternating layers:
// latent possibility, not yet used.
function weakPointGlyph(room){

    // FOLD, as a cascade — attention that should be falling on
    // this room but isn't, thinning as it drops, then pooling
    // into a splash exactly where the room actually sits. More
    // overlooked (lower use) → taller cascade, more streams,
    // bigger pool. Same hiddenness value as before, new shape.
    const group = new THREE.Group();

    const hiddenness = 5 - room.use; // 1..4 across our weak points
    const cascadeHeight = 130 + hiddenness*75;
    const streamCount = 6 + hiddenness*3;

    for(let s=0;s<streamCount;s++){

        const offsetX = (Math.random()-0.5)*46;
        const offsetZ = (Math.random()-0.5)*46;
        const topY = cascadeHeight * (0.6+Math.random()*0.4);
        const steps = 28;
        const pts = [];

        for(let i=0;i<=steps;i++){

            const t = i/steps; // 0 at top, 1 at the room itself
            const y = topY * (1-t);

            // turbulence builds toward the base — the splash where
            // neglect actually lands, not a clean straight drop
            const turbulence = t*t*14;
            const x = room.x + offsetX + (Math.random()-0.5)*turbulence;
            const z = room.z + offsetZ + (Math.random()-0.5)*turbulence;

            pts.push(x,y,z);

        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));

        group.add(new THREE.Line(
            geo,
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.13+Math.random()*0.13 })
        ));

    }

    // the pool at the base — accumulated, sitting exactly where
    // the room is, not spread evenly around it
    const poolPts=[];
    const poolCount = 220 + hiddenness*130;
    const poolRadius = 20 + hiddenness*9;

    for(let i=0;i<poolCount;i++){
        const r = Math.pow(Math.random(),1.8)*poolRadius;
        const a = Math.random()*Math.PI*2;
        poolPts.push(room.x+Math.cos(a)*r, Math.random()*3, room.z+Math.sin(a)*r);
    }

    const poolGeo = new THREE.BufferGeometry();
    poolGeo.setAttribute('position', new THREE.Float32BufferAttribute(poolPts,3));
    group.add(new THREE.Points(poolGeo, new THREE.PointsMaterial({
        size:1.6, color:0xffffff, transparent:true, opacity:0.5
    })));

    return group;

}

// three named sub-groups, one per selectable tab — Fold-family
// (concealment glyphs), Attachment-family (the 8 connections),
// and X-Ray (sightlines to Master Ritual)

const territoryAttach = new THREE.Group();
const territoryXray = new THREE.Group();

// AMBIENT RAIN — the same falling-attention logic scattered
// faintly across the whole footprint, not just at weak points.
// Without this, the 8 cascades read as isolated columns in empty
// space; with it, they're concentrations within a field that's
// already falling everywhere — a full composition, not eight dots

    }

        new THREE.BufferGeometry().setFromPoints(pts),

    ));

}

// CLIP / TAPE / THREAD / PIN / HOOK / TIE / SUSPEND / PATCH —
// connections between weak points, each an improvised attachment
// rather than a structural corridor: this is Steerpike seeing
// space as relationship, pieces held together rather than a
// continuous field
function buildConnection(a,b,style,y1,y2){

    if(y1===undefined) y1=4;
    if(y2===undefined) y2=4;

    const group = new THREE.Group();
    const p1 = new THREE.Vector3(a.x, y1, a.z);
    const p2 = new THREE.Vector3(b.x, y2, b.z);
    const mid = p1.clone().lerp(p2, 0.5);
    const dir = new THREE.Vector3().subVectors(p2,p1).normalize();
    const perp = new THREE.Vector3(-dir.z, 0, dir.x);

    if(style==="thread"){

        // thin wavering line — temporary connection
        const pts=[];
        for(let i=0;i<=20;i++){
            const t=i/20;
            const base = new THREE.Vector3().lerpVectors(p1,p2,t);
            base.addScaledVector(perp, Math.sin(t*Math.PI*6)*4);
            pts.push(base);
        }
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pts),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.22 })
        ));

    }else if(style==="tie"){

        // straight line + a knot loop at the midpoint —
        // provisional relationship, tied rather than built
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([p1,p2]),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.3 })
        ));
        const loopPts=[];
        for(let a2=0;a2<=Math.PI*2+0.1;a2+=0.2){
            loopPts.push(new THREE.Vector3(mid.x+Math.cos(a2)*8, mid.y, mid.z+Math.sin(a2)*8));
        }
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(loopPts),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.4 })
        ));

    }else if(style==="pin"){

        // straight line + a small X — momentary fixation
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([p1,p2]),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.2 })
        ));
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(mid.x-7,mid.y,mid.z-7),
                new THREE.Vector3(mid.x+7,mid.y,mid.z+7)
            ]),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.5 })
        ));
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(mid.x-7,mid.y,mid.z+7),
                new THREE.Vector3(mid.x+7,mid.y,mid.z-7)
            ]),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.5 })
        ));

    }else if(style==="hook"){

        // curved, asymmetric, curling sharply near the far end —
        // opportunistic access, reaching in rather than meeting
        const bow = mid.clone().addScaledVector(perp, 20);
        const curve = new THREE.QuadraticBezierCurve3(p1,bow,p2);
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(curve.getPoints(24)),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.28 })
        ));
        const curlPts=[];
        for(let a2=0;a2<=Math.PI*1.4;a2+=0.15){
            curlPts.push(new THREE.Vector3(p2.x+Math.cos(a2)*6, p2.y, p2.z+Math.sin(a2)*6));
        }
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(curlPts),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.45 })
        ));

    }else if(style==="clip"){

        // straight line + perpendicular bracket ticks at each end —
        // temporary attachment, not structural
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([p1,p2]),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.22 })
        ));
        const tick = perp.clone().multiplyScalar(9);
        [p1,p2].forEach(p=>{
            group.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([p.clone().add(tick), p.clone().sub(tick)]),
                new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.4 })
            ));
        });

    }else if(style==="tape"){

        // two parallel strips overlapping the midpoint —
        // temporary occupation, stuck on rather than built in
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([p1,p2]),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.18 })
        ));
        const off = perp.clone().multiplyScalar(5);
        const seg = dir.clone().multiplyScalar(22);
        [off.clone(), off.clone().negate()].forEach(o=>{
            group.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([
                    mid.clone().add(o).sub(seg), mid.clone().add(o).add(seg)
                ]),
                new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.4 })
            ));
        });

    }else if(style==="suspend"){

        // dashed, fading out before it fully resolves —
        // not fully resolved
        for(let i=0;i<14;i+=2){
            const t1=i/14, t2=Math.min(0.75,(i+1)/14);
            if(t1>0.75) break;
            group.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3().lerpVectors(p1,p2,t1),
                    new THREE.Vector3().lerpVectors(p1,p2,t2)
                ]),
                new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.3*(1-t1) })
            ));
        }

    }else if(style==="patch"){

        // straight line + a small irregular quad overlaid at the
        // midpoint — improvised adaptation, not seamless
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([p1,p2]),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.2 })
        ));
        const s=10;
        const patchPts=[
            mid.clone().add(new THREE.Vector3(-s+Math.random()*3,0,-s)),
            mid.clone().add(new THREE.Vector3(s,0,-s+Math.random()*3)),
            mid.clone().add(new THREE.Vector3(s-Math.random()*3,0,s)),
            mid.clone().add(new THREE.Vector3(-s,0,s-Math.random()*3))
        ];
        group.add(new THREE.LineLoop(
            new THREE.BufferGeometry().setFromPoints(patchPts),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.45 })
        ));

    }

    return group;

}

// nearest-neighbor graph among weak points only — pieces stuck
// together, not a continuous mesh
const weakEdges = [];

weakPoints.forEach((r,i)=>{

    let nearest=null, nearestDist=Infinity;

    weakPoints.forEach((other,j)=>{
        if(i===j) return;
        const d = Math.hypot(r.x-other.x, r.z-other.z);
        if(d<nearestDist){ nearestDist=d; nearest=other; }
    });

    if(nearest){
        const key = [r.name,nearest.name].sort().join("|");
        if(!weakEdges.find(e=>e.key===key)) weakEdges.push({ key, a:r, b:nearest });
    }

});

const CONNECTION_STYLES = ["clip","tape","thread","pin","hook","tie","suspend","patch"];

weakEdges.forEach((e,i)=>{
    territoryAttach.add(buildConnection(e.a, e.b, CONNECTION_STYLES[i % CONNECTION_STYLES.length]));
});

// dangling threads — minor, unresolved attachments at every weak
// point, not just the 8 real connections. Suspend/stop: not fully
// resolved. Fills the layer out instead of leaving it as eight
// isolated links floating in empty space.
weakPoints.forEach(room=>{

    const count = 5 + Math.floor(Math.random()*4);

    for(let i=0;i<count;i++){

        const a = Math.random()*Math.PI*2;
        const len = 40 + Math.random()*90;
        const bend = new THREE.Vector3(
            room.x + Math.cos(a)*len*0.6 + (Math.random()-0.5)*20,
            2,
            room.z + Math.sin(a)*len*0.6 + (Math.random()-0.5)*20
        );
        const end = new THREE.Vector3(
            room.x + Math.cos(a)*len,
            2,
            room.z + Math.sin(a)*len
        );

        territoryAttach.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(room.x,2,room.z), bend, end
            ]),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.08+Math.random()*0.1 })
        ));

    }

});

// X-RAY — seeing beyond surfaces: a faint dashed sightline from

// fractured backdrop — irregular torn-edge shard fragments scattered
// behind the network, so the layer reads as a forensic diagram on a
// broken surface rather than dots floating in empty space
function shardField(cx,cz,w,d,count){

    const group = new THREE.Group();

    for(let i=0;i<count;i++){

        const px = cx + (Math.random()-0.5)*w;
        const pz = cz + (Math.random()-0.5)*d;
        const size = 40 + Math.random()*170;
        const rot = Math.random()*Math.PI*2;

        const p1 = new THREE.Vector3(0,0,0);
        const p2 = new THREE.Vector3(Math.cos(rot)*size, 0, Math.sin(rot)*size);
        const a3 = rot + 0.7 + Math.random()*1.6;
        const p3 = new THREE.Vector3(
            Math.cos(a3)*size*(0.4+Math.random()*0.6),
            0,
            Math.sin(a3)*size*(0.4+Math.random()*0.6)
        );

        const geo = new THREE.BufferGeometry().setFromPoints([p1,p2,p3,p1]);

        const mat = new THREE.LineBasicMaterial({
            color:0xffffff,
            transparent:true,
            opacity:0.05 + Math.random()*0.10
        });

        const shard = new THREE.Line(geo,mat);
        shard.position.set(px,-2,pz);

        group.add(shard);

    }

    return group;

}

// concentric halo rings around a node — the gravity-well /
// lens-flare reading instead of a flat network-diagram dot
function haloRings(cx,cz,baseR){

    const group = new THREE.Group();

    [1.6,2.4,3.4].forEach((mult,i)=>{

        const pts=[];

        for(let a=0;a<=Math.PI*2+0.05;a+=0.08){
            pts.push(new THREE.Vector3(cx+Math.cos(a)*baseR*mult,0,cz+Math.sin(a)*baseR*mult));
        }

        const geo = new THREE.BufferGeometry().setFromPoints(pts);

        const mat = new THREE.LineBasicMaterial({
            color:0xffffff,
            transparent:true,
            opacity:0.14/(i+1)
        });

        group.add(new THREE.Line(geo,mat));

    });

    return group;

}

// radiating shard-burst — jagged rays fanning out from a node,
// used on the two figures whose power is actively in motion
function burst(cx,cz,count,minLen,maxLen,color,baseOpacity){

    const group = new THREE.Group();

    for(let i=0;i<count;i++){

        const angle = Math.random()*Math.PI*2;
        const len = minLen + Math.random()*(maxLen-minLen);
        const x2 = cx + Math.cos(angle)*len;
        const z2 = cz + Math.sin(angle)*len;

        const geo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(cx,0,cz),
            new THREE.Vector3(x2,0,z2)
        ]);

        const mat = new THREE.LineBasicMaterial({
            color,
            transparent:true,
            opacity: baseOpacity*(0.3+Math.random()*0.7)
        });

        group.add(new THREE.Line(geo,mat));

    }

    return group;

}

// a straight relationship line — solid for authority, dashed for
// manipulation, faint for duty
function relLine(p1,p2,color,opacity,dashed){

    const geo = new THREE.BufferGeometry().setFromPoints([p1,p2]);

    const mat = dashed ?
        new THREE.LineDashedMaterial({color,transparent:true,opacity,dashSize:14,gapSize:9}) :
        new THREE.LineBasicMaterial({color,transparent:true,opacity});

    const line = new THREE.Line(geo,mat);

    if(dashed) line.computeLineDistances();

    return line;

}

// a relationship routed like a circuit trace — right-angle bend
// instead of a straight line, with small via pads at each joint.
// this is for the formal channels (authority/duty/manipulation):
// power in Gormenghast runs through fixed routes, not straight lines
function pcbTrace(p1,p2,color,opacity,dashed){

    const group = new THREE.Group();
    const bend = new THREE.Vector3(p2.x, p1.y, p1.z);

    const geo = new THREE.BufferGeometry().setFromPoints([p1,bend,p2]);

    const mat = dashed ?
        new THREE.LineDashedMaterial({color,transparent:true,opacity,dashSize:14,gapSize:9}) :
        new THREE.LineBasicMaterial({color,transparent:true,opacity});

    const line = new THREE.Line(geo,mat);
    if(dashed) line.computeLineDistances();

    group.add(line);

    // via pads at each joint, like a circuit board
    [p1,bend,p2].forEach(pt=>{

        const ringPts=[];
        for(let a=0;a<=Math.PI*2+0.1;a+=0.3){
            ringPts.push(new THREE.Vector3(pt.x+Math.cos(a)*5, pt.y, pt.z+Math.sin(a)*5));
        }

        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(ringPts),
            new THREE.LineBasicMaterial({color,transparent:true,opacity:opacity*0.8})
        ));

    });

    return group;

}

// a wavering relationship line — zigzags between the two nodes,
// tapering to nothing at each end
function wavyLine(p1,p2,color,opacity,segments,amplitude){

    const pts=[];
    const dir = new THREE.Vector3().subVectors(p2,p1);
    const perp = new THREE.Vector3(-dir.z,0,dir.x).normalize();

    for(let i=0;i<=segments;i++){

        const t=i/segments;
        const base = new THREE.Vector3().lerpVectors(p1,p2,t);
        const wobble = Math.sin(t*Math.PI*5) * amplitude * Math.sin(t*Math.PI);

        base.addScaledVector(perp,wobble);
        pts.push(base);

    }

    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    const mat = new THREE.LineBasicMaterial({color,transparent:true,opacity});

    return new THREE.Line(geo,mat);

}

// TEN RULES OF SOCIAL ORDER — ten distinct analytical
// glyphs layered onto the same nodes and rooms, composited
// into one abstract map rather than ten separate diagrams.

const ROLE_TAXONOMY = {
    "Sepulchrave":"Ritual Authority",
    "Fuchsia":"Family",
    "Gertrude":"Family",
    "Flay":"Servants",
    "Swelter":"Servants",
    "Prunesquallor":"Specialists",
    "Steerpike":"Outcasts"
};

const ROLE_TIERS = ["Ritual Authority","Family","Servants","Specialists","Outcasts"];

// bloodline only — Sepulchrave to Fuchsia, father to daughter.
// Servants and Specialists get no lineage tick: their position
// isn't passed down
const LINEAGE = [["Sepulchrave","Fuchsia"]];

const KNOWLEDGE_ROLE = {
    "Sepulchrave":"holder",
    "Prunesquallor":"holder",
    "Flay":"gatekeeper",
    "Steerpike":"seeker"
};

const ACCESS_RADIUS = {
    "Ritual Authority":260,
    "Family":160,
    "Specialists":140,
    "Servants":90,
    "Outcasts":40 // officially the smallest — his manipulation
                  // bursts elsewhere already visibly exceed it
};

// shared helper: a ring built from separate arc segments, so it
// can have real gaps (not just a polyline with skipped points)
function ringSegments(x,z,radius,segments,gapFraction){
    const group = new THREE.Group();
    for(let i=0;i<segments;i++){
        if(Math.random()<gapFraction) continue;
        const a1=(i/segments)*Math.PI*2, a2=((i+0.85)/segments)*Math.PI*2;
        const pts=[];
        for(let t=0;t<=1;t+=0.2){
            const a=a1+(a2-a1)*t;
            pts.push(new THREE.Vector3(x+Math.cos(a)*radius,1.5,z+Math.sin(a)*radius));
        }
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pts),
            new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.35})
        ));
    }
    return group;
}

// RULE 1 — Everyone exists to continue Gormenghast: every node
// grounded by a small root/anchor into the floor, fixed to
// maintenance rather than floating on personal motive
function rule1_maintenanceAnchor(x,z,r){
    const group = new THREE.Group();
    for(let i=0;i<3;i++){
        const a=(i/3)*Math.PI*2+Math.PI/2;
        const len=r*1.3;
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(x,1,z),
                new THREE.Vector3(x+Math.cos(a)*len,-6,z+Math.sin(a)*len)
            ]),
            new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.18})
        ));
    }
    return group;
}

// the room itself, physically swollen — how much a room actually
// keeps Gormenghast running (its own use value) inflates its real
// footprint. A room used constantly to maintain the castle gets
// visibly fat; a room barely used stays thin, close to its true size
function rule1_fatRoom(x,z,room){

    const swell = 1 + (room.use/10)*1.6; // use 1..10 -> 1.16x .. 2.6x
    const w = room.w*0.4*swell;
    const d = room.d*0.4*swell;

    const group = new THREE.Group();

    const fill = new THREE.Mesh(
        new THREE.PlaneGeometry(w,d),
        new THREE.MeshBasicMaterial({
            color:0xffffff, transparent:true,
            opacity: 0.05+(room.use/10)*0.13,
            side:THREE.DoubleSide
        })
    );
    fill.rotation.x = -Math.PI/2;
    fill.position.set(x, 0.5, z);
    group.add(fill);

    const pts = [
        new THREE.Vector3(-w/2,0,-d/2), new THREE.Vector3(w/2,0,-d/2),
        new THREE.Vector3(w/2,0,d/2), new THREE.Vector3(-w/2,0,d/2)
    ];
    pts.push(pts[0]);

    group.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts.map(p=>new THREE.Vector3(x+p.x,1,z+p.z))),
        new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.15+(room.use/10)*0.3 })
    ));

    return group;

}

// RULE 2 — Ritual overrides function: the room a character
// occupies gets two overlapping footprints, a clean functional
// rectangle and a skewed ritual one, both at the room's own real
// proportions (scaled down, not an arbitrary fixed box) — skew
// proportional to that room's actual use value. The gap between
// them is the conflict.
function rule2_ritualVsFunction(room){
    const group = new THREE.Group();
    const w=room.w*0.35, d=room.d*0.35;
    const funcPts=[
        new THREE.Vector3(room.x-w/2,0,room.z-d/2),
        new THREE.Vector3(room.x+w/2,0,room.z-d/2),
        new THREE.Vector3(room.x+w/2,0,room.z+d/2),
        new THREE.Vector3(room.x-w/2,0,room.z+d/2)
    ];
    funcPts.push(funcPts[0]);
    group.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(funcPts),
        new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.2})
    ));
    const skew=(room.use/10)*w*0.5;
    const ritualPts=[
        new THREE.Vector3(room.x-w/2+skew,2,room.z-d/2),
        new THREE.Vector3(room.x+w/2+skew*0.5,2,room.z-d/2-skew*0.3),
        new THREE.Vector3(room.x+w/2-skew*0.3,2,room.z+d/2),
        new THREE.Vector3(room.x-w/2-skew*0.5,2,room.z+d/2+skew*0.3)
    ];
    ritualPts.push(ritualPts[0]);
    group.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(ritualPts),
        new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.35})
    ));
    return group;
}

// RULE 3 — Duty precedes individuality: a short "personal"
// tendril off the node, deliberately shorter for high-authority
// figures — the more power, the less room for a self outside
// the role
function rule3_personalTendril(x,z,power){
    const len=Math.max(8,55-power*2);
    const angle=Math.random()*Math.PI*2;
    const pts=[];
    for(let i=0;i<=10;i++){
        const t=i/10;
        pts.push(new THREE.Vector3(
            x+Math.cos(angle)*len*t+Math.sin(t*8)*3, 0.5,
            z+Math.sin(angle)*len*t+Math.cos(t*8)*3
        ));
    }
    return new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.3})
    );
}

// RULE 4 — Every inhabitant has a prescribed role: a small
// 5-tier ladder above each node, lit at the tier they actually
// occupy
function rule4_roleTaxonomy(x,z,role){
    const group = new THREE.Group();
    const tierIndex = ROLE_TIERS.indexOf(role);
    const baseY=40;
    ROLE_TIERS.forEach((tier,i)=>{
        const y=baseY+i*10;
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(x-3,y,z), new THREE.Vector3(x+3,y,z)
            ]),
            new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity: i===tierIndex?0.6:0.12})
        ));
    });
    group.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(x,baseY,z), new THREE.Vector3(x,baseY+40,z)
        ]),
        new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.1})
    ));
    return group;
}

// RULE 5 — Roles are inherited, not chosen: a directional
// line between bloodline nodes only
function rule5_lineage(a,b){
    const group = new THREE.Group();
    group.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(a.x,50,a.z), new THREE.Vector3(b.x,50,b.z)
        ]),
        new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.3})
    ));
    const dir = new THREE.Vector3(b.x-a.x,0,b.z-a.z).normalize();
    const perp = new THREE.Vector3(-dir.z,0,dir.x).multiplyScalar(4);
    const tip = new THREE.Vector3(b.x,50,b.z);
    const back = tip.clone().addScaledVector(dir,-10);
    group.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([back.clone().add(perp), tip, back.clone().sub(perp)]),
        new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.4})
    ));
    return group;
}

// RULE 6 — Identity is produced by position: the node's own
// outer ring shape encodes role, not name — what's visually
// distinct is the position, not the person
function rule6_roleShape(x,z,r,role){
    if(role==="Ritual Authority") return ringSegments(x,z,r*1.8,6,0);
    if(role==="Family")           return ringSegments(x,z,r*1.8,4,0);
    if(role==="Servants")         return ringSegments(x,z,r*1.8,3,0);
    if(role==="Specialists")      return ringSegments(x,z,r*1.8,16,0.35);
    if(role==="Outcasts")         return ringSegments(x,z,r*1.8,10,0.55);
    return new THREE.Group();
}

// RULE 7 — Access is determined by status: a translucent
// reach-ring sized by role tier, not by the individual
function rule7_accessZone(x,z,role){
    const radius = ACCESS_RADIUS[role] || 60;
    const pts=[];
    for(let a=0;a<=Math.PI*2+0.05;a+=0.1){
        pts.push(new THREE.Vector3(x+Math.cos(a)*radius,0.2,z+Math.sin(a)*radius));
    }
    return new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.08})
    );
}

// RULE 8 — Space determines behavior: tick density around the
// node scales with how ritually busy that character's actual
// room is
function rule8_behaviorTicks(x,z,r,use){
    const group = new THREE.Group();
    const count = 4+use*2;
    for(let i=0;i<count;i++){
        const a=Math.random()*Math.PI*2;
        const r1=r*1.1, r2=r1+4+Math.random()*6;
        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(x+Math.cos(a)*r1,0.8,z+Math.sin(a)*r1),
                new THREE.Vector3(x+Math.cos(a)*r2,0.8,z+Math.sin(a)*r2)
            ]),
            new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.12+Math.random()*0.1})
        ));
    }
    return group;
}

// RULE 9 — Knowledge is unequally distributed: holders project
// outward, seekers reach inward toward others, gatekeepers sit
// behind a gapped ring that controls what passes through
function rule9_knowledge(x,z,r,role){
    const group = new THREE.Group();
    if(role==="holder"){
        for(let i=0;i<10;i++){
            const a=(i/10)*Math.PI*2;
            group.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(x+Math.cos(a)*r*1.5,3,z+Math.sin(a)*r*1.5),
                    new THREE.Vector3(x+Math.cos(a)*r*2.3,3,z+Math.sin(a)*r*2.3)
                ]),
                new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:0.3})
            ));
        }
    }else if(role==="seeker"){
        for(let i=0;i<10;i++){
            const a=(i/10)*Math.PI*2;
            group.add(new THREE.Line(
                new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(x+Math.cos(a)*r*2.3,3,z+Math.sin(a)*r*2.3),
                    new THREE.Vector3(x+Math.cos(a)*r*1.5,3,z+Math.sin(a)*r*1.5)
                ]),
                new THREE.LineBasicMaterial({color:0xff5555,transparent:true,opacity:0.25})
            ));
        }
    }else if(role==="gatekeeper"){
        group.add(ringSegments(x,z,r*1.6,12,0.4));
    }
    return group;
}

// physical version of rule 7 — instead of an abstract reach-ring,
// draw every one of the 16 real rooms as a small outline: bright
// if within this character's actual status-based reach, nearly
// invisible if not. Maps exactly what the rule asks for — where
// this rank can and cannot go — using the real castle, not a radius
function rule7_accessMap(x,z,role){

    const radius = ACCESS_RADIUS[role] || 60;
    const group = new THREE.Group();

    rooms.forEach(r=>{

        const dist = Math.hypot(r.x-x, r.z-z);
        const accessible = dist <= radius;
        const w = r.w*0.22, d = r.d*0.22;

        const pts = [
            new THREE.Vector3(r.x-w/2,0.3,r.z-d/2), new THREE.Vector3(r.x+w/2,0.3,r.z-d/2),
            new THREE.Vector3(r.x+w/2,0.3,r.z+d/2), new THREE.Vector3(r.x-w/2,0.3,r.z+d/2)
        ];
        pts.push(pts[0]);

        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pts),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity: accessible ? 0.35 : 0.05 })
        ));

    });

    return group;

}

// physical version of rule 8 — an actual curved trail from this
// character's room to the real rooms their role would plausibly
// take them, instead of abstract ticks around the node
const BEHAVIOR_DESTINATIONS = {
    "Sepulchrave":["Library"],

    "Gertrude":["Lake"],

function rule8_behaviorTrail(x,z,name){

    const group = new THREE.Group();
    const dests = BEHAVIOR_DESTINATIONS[name] || [];

    dests.forEach(dname=>{

        const d = roomByName[dname];
        if(Math.abs(d.x-x)<1 && Math.abs(d.z-z)<1) return; // already there

        const mid = new THREE.Vector3((x+d.x)/2, 10, (z+d.z)/2);
        const curve = new THREE.QuadraticBezierCurve3(
            new THREE.Vector3(x,2,z), mid, new THREE.Vector3(d.x,2,d.z)
        );

        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(curve.getPoints(18)),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.28 })
        ));

    });

    return group;

}

// physical version of rule 9 — knowledge tied to the actual rooms
// where it lives: holders' knowledge sits in a real room (the
// Library, the Study), seekers reach toward those same real rooms,
// gatekeepers highlight the real rooms they actually control
// passage through
const KNOWLEDGE_ROOMS = {
    "Sepulchrave":["Library"],
    "Prunesquallor":["Prunesquallor Study"],
    "Steerpike":["Library","Prunesquallor Study"],
    "Flay":["Master Ritual","Ancestral Dining Hall"]
};

function rule9_knowledgeMap(x,z,name,role){

    const group = new THREE.Group();
    const targets = KNOWLEDGE_ROOMS[name] || [];
    const color = role==="seeker" ? 0xff5555 : 0xffffff;

    targets.forEach(rname=>{

        const room = roomByName[rname];

        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(x,3,z), new THREE.Vector3(room.x,3,room.z)
            ]),
            new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.32 })
        ));

        const w = room.w*0.28, d = room.d*0.28;
        const pts=[
            new THREE.Vector3(room.x-w/2,2,room.z-d/2), new THREE.Vector3(room.x+w/2,2,room.z-d/2),
            new THREE.Vector3(room.x+w/2,2,room.z+d/2), new THREE.Vector3(room.x-w/2,2,room.z+d/2)
        ];
        pts.push(pts[0]);

        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(pts),
            new THREE.LineBasicMaterial({ color, transparent:true, opacity:0.45 })
        ));

    });

    return group;

}

// COLLAGE BACKDROP — dense black fracture shards
// concentrated where the social fabric is actually
// breaking (conflict and manipulation edges), plus
// circular motifs at the seat of ritual authority.
// Always visible, same as the base nodes — this is
// what gives the layer its overall texture regardless

function blackFractureShard(cx,cz,size,angle){

    const a = new THREE.Vector3(0,0,0);
    const b = new THREE.Vector3(size*(0.7+Math.random()*0.6), 0, size*(0.15+Math.random()*0.3));
    const c = new THREE.Vector3(size*(0.15+Math.random()*0.35), 0, -size*(0.9+Math.random()*0.8));

    const geo = new THREE.BufferGeometry().setFromPoints([a,b,c]);
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
        color:0x000000, side:THREE.DoubleSide, transparent:true, opacity:1
    }));
    mesh.position.set(cx,-3,cz);
    mesh.rotation.y = angle;

    const group = new THREE.Group();
    group.add(mesh);

    const edges = new THREE.LineSegments(
        new THREE.EdgesGeometry(geo),
        new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.3 })
    );
    edges.position.copy(mesh.position);
    edges.rotation.copy(mesh.rotation);
    group.add(edges);

    return group;

}

// scatter shards around every conflict/manipulation relationship —
// the instability itself is what fractures the collage, not an
// arbitrary decorative field
relationships
    .filter(([a,b,type]) => type==="conflict" || type==="manipulation")
    .forEach(([a,b,type])=>{

        const A = nodeByName[a], B = nodeByName[b];
        const midX = (A.x+B.x)/2, midZ = (A.z+B.z)/2;
        const count = type==="conflict" ? 6 : 4; // conflict is the more violent fracture

        for(let i=0;i<count;i++){
            socialBase.add(blackFractureShard(
                midX + (Math.random()-0.5)*220,
                midZ + (Math.random()-0.5)*220,
                60 + Math.random()*140,
                Math.random()*Math.PI*2
            ));
        }

    });

// circular motifs — the reference's floating portholes — placed
// at nodes whose role is Ritual Authority, sized by their power
function collageMotif(cx,cz,radius){

    const group = new THREE.Group();

    const disc = new THREE.Mesh(
        new THREE.CircleGeometry(radius,40),
        new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.85, side:THREE.DoubleSide })
    );
    disc.rotation.x = -Math.PI/2;
    disc.position.set(cx,-1,cz);
    group.add(disc);

    const ringPts=[];
    for(let a=0;a<=Math.PI*2+0.05;a+=0.08){
        ringPts.push(new THREE.Vector3(cx+Math.cos(a)*radius*1.3, 0, cz+Math.sin(a)*radius*1.3));
    }
    group.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(ringPts),
        new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.4 })
    ));

    return group;

}

Object.keys(ROLE_TAXONOMY)

    .forEach(name=>{
        const n = nodeByName[name];
        socialBase.add(collageMotif(n.x, n.z, n.r*2.2));
    });

// a smaller circular motif at every character, not just Ritual

const engineLayer=new THREE.Group();

scene.add(engineLayer);

// the velocity field itself — scattered along the real room-to-room
// route (steerpikePointAt), not an arbitrary sine wave, so this layer
// physically passes through the same coordinates as the other layers.
// Rendered as blocky dither squares (varying size, one InstancedMesh
// draw call) instead of round points — overlapping transparent blocks
// naturally read as halftone shading where the field is denser, no
// per-block opacity trickery needed.
// TWO TIERS, matching the reference's mix of continuous static
// and larger blocky patches. The earlier single pass at 7000
// instances was spread across the whole multi-thousand-unit
// route and read as isolated floating squares — nowhere near
// dense enough to actually merge into noise. This fixes that.

// fine grain — many small blocks, forming the base continuous
// static texture along the route
const FINE_COUNT = 45000;
const fineGeo = new THREE.PlaneGeometry(1,1);
const fineMat = new THREE.MeshBasicMaterial({
    color:0xff5555, transparent:true, opacity:0.28, side:THREE.DoubleSide
});
const engineFine = new THREE.InstancedMesh(fineGeo, fineMat, FINE_COUNT);
const fineDummy = new THREE.Object3D();

for(let i=0;i<FINE_COUNT;i++){

    const t = Math.random();
    const p = steerpikePointAt(t);
    const spread = 55;
    const bx = p.x + (Math.random()-0.5)*spread;
    const bz = p.z + (Math.random()-0.5)*spread;
    const size = 0.8 + Math.random()*2.4;

    fineDummy.position.set(bx, Math.random()*1.5, bz);
    fineDummy.rotation.set(-Math.PI/2, 0, 0);
    fineDummy.scale.set(size,size,1);
    fineDummy.updateMatrix();

    engineFine.setMatrixAt(i, fineDummy.matrix);

}

engineFine.instanceMatrix.needsUpdate = true;
engineLayer.add(engineFine);

// coarse halftone — fewer, larger blocks on top of the fine
// grain, the bigger dark/light patches within the noise
const COARSE_COUNT = 7000;
const coarseGeo = new THREE.PlaneGeometry(1,1);
const coarseMat = new THREE.MeshBasicMaterial({
    color:0xff5555, transparent:true, opacity:0.38, side:THREE.DoubleSide
});
const engineCoarse = new THREE.InstancedMesh(coarseGeo, coarseMat, COARSE_COUNT);
const coarseDummy = new THREE.Object3D();

for(let i=0;i<COARSE_COUNT;i++){

    const t = Math.random();
    const p = steerpikePointAt(t);
    const spread = 70;
    const bx = p.x + (Math.random()-0.5)*spread;
    const bz = p.z + (Math.random()-0.5)*spread;
    const size = 4 + Math.random()*10;

    coarseDummy.position.set(bx, Math.random()*2, bz);
    coarseDummy.rotation.set(-Math.PI/2, 0, 0);
    coarseDummy.scale.set(size,size,1);
    coarseDummy.updateMatrix();

    engineCoarse.setMatrixAt(i, coarseDummy.matrix);

}

engineCoarse.instanceMatrix.needsUpdate = true;
engineLayer.add(engineCoarse);

// vertical stripe bursts at every real room — the reference's
// banded, barcode-like regions, planted where the shockwaves
// already are rather than anywhere arbitrary
function stripeBurst(room,count){

    const group = new THREE.Group();

    for(let i=0;i<count;i++){

        const ox = (Math.random()-0.5)*100;
        const oz = (Math.random()-0.5)*100;
        const h = 5 + Math.random()*24;

        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(room.x+ox, 0, room.z+oz),
                new THREE.Vector3(room.x+ox, h, room.z+oz)
            ]),
            new THREE.LineBasicMaterial({ color:0xff5555, transparent:true, opacity:0.15+Math.random()*0.35 })
        ));

    }

    return group;

}

function starMaterial(opacity){
    return new THREE.PointsMaterial({
        size:3,
        color:0xffffff,
        transparent:true,
        opacity: opacity===undefined ? 0.8 : opacity
    });
}

// five numbered stage sub-groups, one per selectable tab
const steerpikeStages = {};
for(let i=1;i<=5;i++){
    steerpikeStages[i] = new THREE.Group();
    characterLayer.add(steerpikeStages[i]);
}

function addStageCluster(group,pts,opacity){
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
    group.add(new THREE.Points(geo, starMaterial(opacity)));
}

function stageTrail(group,rooms){
    const pts = rooms.map(r=>new THREE.Vector3(r.x,4,r.z));
    group.add(new THREE.Line(
        new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color:0xff5555, transparent:true, opacity:0.5 })
    ));
}

function stageCluster(group,room,count,radius,opacity){
    const pts=[];
    for(let i=0;i<count;i++){
        const r = Math.pow(Math.random(),1.6)*radius;
        const a = Math.random()*Math.PI*2;
        pts.push(room.x+Math.cos(a)*r, 0, room.z+Math.sin(a)*r);
    }
    addStageCluster(group,pts,opacity);
}

// DITHER — the system destabilizing under him, more the further
// he gets. Blocky, glitching pixel-scale panels instead of clean
// points: stage 1 is barely there, stage 5 is thick with it —
// he isn't just occupying these rooms by the end, he's corrupting
// the picture of the castle itself
function stageDither(group,room,stage,radius){

    const blockCount = 20 + stage*18;
    const maxBlockSize = 3 + stage*2.2;

    for(let i=0;i<blockCount;i++){

        const r = Math.pow(Math.random(),1.4)*radius;
        const a = Math.random()*Math.PI*2;
        const bx = room.x + Math.cos(a)*r;
        const bz = room.z + Math.sin(a)*r;
        const size = 2 + Math.random()*maxBlockSize;

        const block = new THREE.Mesh(
            new THREE.PlaneGeometry(size,size),
            new THREE.MeshBasicMaterial({
                color:0xffffff, transparent:true,
                opacity: 0.15+Math.random()*0.35,
                side:THREE.DoubleSide
            })
        );
        block.rotation.x = -Math.PI/2;
        block.position.set(bx, Math.random()*2, bz);
        group.add(block);

    }

}

// trail dither — the same escalating corruption, but scattered
// ALONG the path between this stage's rooms instead of only at
// the rooms themselves. Without this, the five stages read as
// isolated pockets in a mostly empty footprint; with it, the
// whole route he actually walks fills in
function trailDither(group,rooms,stage){

    for(let i=0;i<rooms.length-1;i++){

        const a = rooms[i], b = rooms[i+1];
        const count = 30 + stage*22;

        for(let j=0;j<count;j++){

            const t = Math.random();
            const spread = 20 + stage*10;
            const bx = a.x + (b.x-a.x)*t + (Math.random()-0.5)*spread;
            const bz = a.z + (b.z-a.z)*t + (Math.random()-0.5)*spread;
            const size = 1.5 + Math.random()*(2+stage*1.4);

            const block = new THREE.Mesh(
                new THREE.PlaneGeometry(size,size),
                new THREE.MeshBasicMaterial({
                    color:0xff5555, transparent:true,
                    opacity: 0.1+Math.random()*0.22,
                    side:THREE.DoubleSide
                })
            );
            block.rotation.x = -Math.PI/2;
            block.position.set(bx, Math.random()*2, bz);
            group.add(block);

        }

    }

}

// STAGE 1 — ARRIVAL: the Great Kitchen, where he starts as a

stageDither(steerpikeStages[1], roomByName["Great Kitchen"], 1, 90);

// personal significance, per character — deliberately NOT the
// same as the objective `use` field on rooms. Fuchsia's Library
// weight is zero: it dominates the castle's objective use, but
// means nothing to her personally. That divergence is the point.
const SUBJECTIVE_WORLDS = {

    "Fuchsia": [
        { room:"Fuchsia Attic",     weight:10 },
        { room:"Castle Roofscape",  weight:7  },
        { room:"Countess Chamber",  weight:4  },
        { room:"Cora Clarice",      weight:2  }
    ],

    "Sepulchrave": [
        { room:"Library",              weight:10 },
        { room:"Master Ritual",        weight:6  },
        { room:"Ancestral Dining Hall",weight:4  }
    ]

};

// a node as a density cluster, not a flat disc — point cloud +
// layered contour rings + fine radiating ticks, all scaled by how
// much this room actually matters to this character. more weight
// = more points, more rings, more texture, not just a bigger circle
function heatNode(x,z,weight){

    const group = new THREE.Group();
    const radius = 14 + weight*7;

    const pts=[];
    const pointCount = 140 + weight*45;

    for(let i=0;i<pointCount;i++){
        const r = Math.pow(Math.random(),1.6)*radius;
        const a = Math.random()*Math.PI*2;
        pts.push(x+Math.cos(a)*r, 0, z+Math.sin(a)*r);
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
    group.add(new THREE.Points(geo, new THREE.PointsMaterial({
        size:2.2, color:0xffffff, transparent:true, opacity:0.55
    })));

    // layered contour rings — topographic density read instead of
    // one clean outline
    [0.6,1.0,1.5,2.2].forEach((mult,i)=>{

        const ringPts=[];
        for(let a=0;a<=Math.PI*2+0.05;a+=0.15){
            ringPts.push(new THREE.Vector3(x+Math.cos(a)*radius*mult, 0.4+i*0.3, z+Math.sin(a)*radius*mult));
        }

        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(ringPts),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.24/(i+1) })
        ));

    });

    // fine radiating ticks fraying outward — texture at the edge,
    // more of them the more this room matters
    const tickCount = 16 + weight*3;

    for(let i=0;i<tickCount;i++){

        const a = Math.random()*Math.PI*2;
        const r1 = radius*(1.6+Math.random()*0.3);
        const r2 = r1 + 6+Math.random()*12;

        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(x+Math.cos(a)*r1,0,z+Math.sin(a)*r1),
                new THREE.Vector3(x+Math.cos(a)*r2,0,z+Math.sin(a)*r2)
            ]),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.14+Math.random()*0.16 })
        ));

    }

    return group;

}

// a route between two of this character's rooms as a heat-trail —
// many jittered, bowed strands instead of one clean line, so it
// reads as a smeared trace of repeated movement, not a vector arrow
function heatTrail(a,b,y1,y2){

    if(y1===undefined) y1=2;
    if(y2===undefined) y2=2;

    const group = new THREE.Group();

    const dx = b.z-a.z, dz = b.x-a.x;
    const perpLen = Math.sqrt(dx*dx+dz*dz) || 1;
    const perpX = -dx/perpLen, perpZ = dz/perpLen;

    const strandCount = 11;

    for(let s=0;s<strandCount;s++){

        const jitter = (s-strandCount/2)*3 + (Math.random()-0.5)*6;

        const p1 = new THREE.Vector3(a.x + perpX*jitter*0.3, y1, a.z + perpZ*jitter*0.3);
        const p2 = new THREE.Vector3(b.x + perpX*jitter*0.3, y2, b.z + perpZ*jitter*0.3);
        const mid = p1.clone().lerp(p2,0.5).add(new THREE.Vector3(perpX*jitter, 0, perpZ*jitter));

        const curve = new THREE.QuadraticBezierCurve3(p1,mid,p2);

        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(curve.getPoints(24)),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.04+Math.random()*0.11 })
        ));

    }

    return group;

}

// PANELS + CIRCUITRY — dense reflective panels and fine trace
// routing around each significant node, more of both the more
// personally significant that room is. This is what gives
// Character Atlas its own texture: a small dense complex around
// each memory, not just a node and a connecting line
function nodeComplex(x,z,weight){

    const group = new THREE.Group();

    // reflective panels — flat quads at varying rotation and
    // opacity, like architectural surfaces catching light
    // differently. more of them for higher-weight rooms.
    const panelCount = 2 + Math.round(weight*0.6);

    for(let i=0;i<panelCount;i++){

        const pw = 14 + Math.random()*(20+weight*3);
        const pd = 10 + Math.random()*(16+weight*2);
        const offsetR = 20 + Math.random()*(30+weight*4);
        const a = Math.random()*Math.PI*2;
        const px = x + Math.cos(a)*offsetR;
        const pz = z + Math.sin(a)*offsetR;

        const panel = new THREE.Mesh(
            new THREE.PlaneGeometry(pw,pd),
            new THREE.MeshBasicMaterial({
                color:0xffffff, transparent:true,
                opacity: 0.05+Math.random()*0.14,
                side:THREE.DoubleSide
            })
        );
        panel.rotation.x = -Math.PI/2;
        panel.rotation.z = Math.random()*Math.PI;
        panel.position.set(px, 0.5+Math.random()*3, pz);
        group.add(panel);

        // thin edge outline so the panel reads as a distinct
        // surface, not a soft blob
        const edgePts = [
            new THREE.Vector3(-pw/2,0,-pd/2), new THREE.Vector3(pw/2,0,-pd/2),
            new THREE.Vector3(pw/2,0,pd/2), new THREE.Vector3(-pw/2,0,pd/2)
        ];
        edgePts.push(edgePts[0]);
        const edgeLine = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints(edgePts),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.25 })
        );
        edgeLine.rotation.copy(panel.rotation);
        edgeLine.position.copy(panel.position);
        group.add(edgeLine);

    }

    // fine circuit micro-routing — short orthogonal traces
    // fraying outward, denser at higher weight
    const traceCount = 4 + Math.round(weight*1.2);

    for(let i=0;i<traceCount;i++){

        const a = Math.random()*Math.PI*2;
        const r1 = 8 + weight*3;
        const bend = r1 + 6+Math.random()*10;
        const r2 = bend + 4+Math.random()*10;

        const p1 = new THREE.Vector3(x+Math.cos(a)*r1, 1, z+Math.sin(a)*r1);
        const p2 = new THREE.Vector3(x+Math.cos(a)*bend, 1, z+Math.sin(a)*bend);
        const p3 = new THREE.Vector3(p2.x + (Math.random()-0.5)*r2, 1, p2.z + (Math.random()-0.5)*r2);

        group.add(new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([p1,p2,p3]),
            new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:0.18+Math.random()*0.15 })
        ));

    }

    return group;

}

function buildSubjectiveWorld(entries){

    const group = new THREE.Group();
    const nodes = entries.map(e=>({ ...roomByName[e.room], weight:e.weight }));

    // route between this character's own significant rooms, in
    // descending order of what matters most to them — their
    // personal path through the castle, not a generic corridor
    const sorted = [...nodes].sort((a,b)=>b.weight-a.weight);

    for(let i=0;i<sorted.length-1;i++){
        group.add(heatTrail(sorted[i], sorted[i+1]));
    }

    // a node per significant room, sized and textured by how much
    // it matters to this character specifically, plus the
    // panel/circuitry complex around it
    nodes.forEach(n=>{
        group.add(heatNode(n.x, n.z, n.weight));
        group.add(nodeComplex(n.x, n.z, n.weight));
    });

    return group;

}

function buildSubjectiveWorld3D(entries){

    const group = new THREE.Group();
    const nodes = entries.map(e=>({ ...roomByName[e.room], weight:e.weight }));
    const sorted = [...nodes].sort((a,b)=>b.weight-a.weight);

    for(let i=0;i<sorted.length-1;i++){
        const a = sorted[i], b = sorted[i+1];
        group.add(heatTrail(a,b, a.y+a.h/2, b.y+b.h/2));
    }

    nodes.forEach(n=>{
        const y = n.y + n.h;
        group.add(elevate(heatNode(n.x,n.z,n.weight), y));
        group.add(elevate(nodeComplex(n.x,n.z,n.weight), y));
    });

    return group;

}

function steerpikeYAt(t){
    const n = steerpikeWaypoints.length - 1;
    const scaled = Math.max(0,Math.min(1,t)) * n;
    const i = Math.min(n-1, Math.floor(scaled));
    const localT = scaled - i;
    const a = steerpikeWaypoints[i], b = steerpikeWaypoints[i+1];
    const ya = a.y + a.h/2, yb = b.y + b.h/2;
    const ha = a.h, hb = b.h;
    return {
        y: ya + (yb-ya)*localT,
        spread: Math.max(ha + (hb-ha)*localT, 220)
    };
}

// tag every material in every layer with its resting opacity,
// so we can fade layers up/down without losing their original look
LAYERS.forEach(layer=>{

    layer.group.traverse(child=>{

        if(child===layer.hit) return;

        if(child.material){

            const mats = Array.isArray(child.material) ? child.material : [child.material];

            mats.forEach(m=>{

                if(m.userData.baseOpacity===undefined){
                    m.userData.baseOpacity = m.transparent ? m.opacity : 1;
                    m.transparent = true;
                }

            });

        }

    });

    layer.currentFade = 1;
    layer.targetFade = 1;

});

function setLayerFade(layer,factor){

    layer.group.traverse(child=>{

        if(child===layer.hit) return;

        if(child.material){

            const mats = Array.isArray(child.material) ? child.material : [child.material];

            mats.forEach(m=>{
                m.opacity = m.userData.baseOpacity * factor;
            });

        }

    });

}

// same fade logic, but for a raw group (used for Paracosm Atlas's
// nested sub-layers, which don't have their own top-level hit-plane)
function setGroupFade(group,factor){

    group.traverse(child=>{

        if(child.material){

            const mats = Array.isArray(child.material) ? child.material : [child.material];

            mats.forEach(m=>{
                if(m.userData.baseOpacity!==undefined){
                    m.opacity = m.userData.baseOpacity * factor;
                }
            });

        }

    });

}

        // hover shows what you're actually looking at — the
